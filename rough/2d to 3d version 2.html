<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Studio</title>

  <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #11131a;
      color: #f4f4f5;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px 25px;
      background: #1b1e29;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h2 {
      margin: 0;
      font-size: 20px;
    }

    .app {
      display: grid;
      grid-template-columns: 290px 1fr;
      min-height: calc(100vh - 65px);
    }

    .sidebar {
      padding: 22px;
      background: #191c25;
      border-right: 1px solid #333;
    }

    .sidebar h3 {
      font-size: 14px;
      color: #aaa;
      margin-top: 24px;
    }

    button,
    .upload {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 9px 0;
      border: 1px solid #3b3e4b;
      border-radius: 8px;
      background: #292d3a;
      color: white;
      cursor: pointer;
      font-size: 13px;
    }

    button:hover {
      background: #44495a;
    }

    button.active {
      background: #a78bfa;
      color: #171323;
      border-color: #a78bfa;
    }

    .primary {
      background: #a78bfa;
      color: #171323;
      font-weight: bold;
      border: 0;
    }

    input[type=file] {
      width: 100%;
      margin: 12px 0;
      font-size: 12px;
    }

    input[type=range] {
      width: 100%;
      accent-color: #a78bfa;
    }

    label {
      display: block;
      margin-top: 14px;
      font-size: 12px;
      color: #c3c4ce;
    }

    .viewport {
      position: relative;
      min-width: 0;
      min-height: 650px;
      background: #11131a;
    }

    #canvas-container {
      position: absolute;
      inset: 0;
    }

    #canvas-container canvas {
      display: block;
    }

    .toolbar {
      position: absolute;
      z-index: 2;
      top: 15px;
      left: 15px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .toolbar button {
      width: auto;
      margin: 0;
      padding: 9px 13px;
    }

    .status {
      position: absolute;
      bottom: 15px;
      left: 15px;
      background: #252938;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      color: #ccc;
    }

    .help {
      font-size: 11px;
      color: #9296a5;
      line-height: 1.6;
    }

    @media(max-width:750px) {
      .app {
        grid-template-columns: 1fr;
      }

      .viewport {
        min-height: 550px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h2>✦ 3D Model Studio</h2>
    <span style="font-size:12px;color:#aaa">Geometry Lab</span>
  </header>

  <div class="app">

    <aside class="sidebar">

      <h3>IMPORT</h3>

      <label>Upload 2D Image (AI conversion)</label>
      <input type="file" id="imageInput" accept="image/*">

      <button class="primary" id="generateBtn">
        ✨ Generate 3D Model
      </button>

      <label>Or import an existing 3D model</label>
      <input type="file" id="modelInput" accept=".glb,.gltf">

      <h3>VIEW MODES</h3>

      <button class="mode active" data-mode="solid">
        Solid View
      </button>

      <button class="mode" data-mode="wireframe">
        Wireframe View
      </button>

      <button class="mode" data-mode="transparent">
        Transparent View
      </button>

      <button class="mode" data-mode="both">
        Solid + Wireframe
      </button>

      <h3>GEOMETRY</h3>

      <label>Wireframe visibility</label>
      <input type="range" id="wireOpacity" min="0.1" max="1" step="0.05" value="0.8">

      <label>Vertex size</label>
      <input type="range" id="vertexSize" min="0.01" max="0.12" step="0.01" value="0.035">

      <button id="verticesBtn">Show Vertices</button>

      <h3>MODEL CONTROLS</h3>

      <button id="resetBtn">Reset Camera</button>
      <button id="rotateBtn">Auto Rotate: OFF</button>
      <button id="exportBtn" class="primary">
        Download 3D Model (.glb)
      </button>

      <p class="help">
        Mouse drag: Rotate<br>
        Scroll: Zoom<br>
        Right drag: Move<br>
        Wireframe: Inspect mesh edges
      </p>

    </aside>

    <main class="viewport">

      <div class="toolbar">
        <button id="frontBtn">Front</button>
        <button id="sideBtn">Side</button>
        <button id="topBtn">Top</button>
        <button id="fitBtn">Fit Model</button>
      </div>

      <div id="canvas-container"></div>

      <div class="status" id="status">
        Ready · Import a model to begin
      </div>

    </main>
  </div>

  <script type="module">

    import * as THREE from 'three';

    import { OrbitControls }
      from 'three/addons/controls/OrbitControls.js';

    import { GLTFLoader }
      from 'three/addons/loaders/GLTFLoader.js';

    import { GLTFExporter }
      from 'three/addons/exporters/GLTFExporter.js';

    const container =
      document.getElementById('canvas-container');

    const status =
      document.getElementById('status');

    // SCENE

    const scene = new THREE.Scene();

    scene.background = new THREE.Color('#11131a');

    const camera = new THREE.PerspectiveCamera(
      45, 1, 0.01, 1000
    );

    camera.position.set(4, 3, 6);

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    container.appendChild(renderer.domElement);

    // CONTROLS

    const controls = new OrbitControls(
      camera, renderer.domElement
    );

    controls.enableDamping = true;
    controls.dampingFactor = 0.06;

    // LIGHTS

    scene.add(new THREE.HemisphereLight(
      0xffffff, 0x444466, 2
    ));

    const light = new THREE.DirectionalLight(
      0xffffff, 3
    );

    light.position.set(5, 8, 5);
    scene.add(light);

    // GRID

    const grid = new THREE.GridHelper(
      10, 20, 0x555566, 0x292d3a
    );

    scene.add(grid);

    const axes = new THREE.AxesHelper(1.5);
    scene.add(axes);

    // MODEL

    let model = null;
    let wireGroup = new THREE.Group();
    let vertexGroup = new THREE.Group();

    scene.add(wireGroup);
    scene.add(vertexGroup);

    let currentMode = 'solid';
    let showVertices = false;
    let autoRotate = false;

    // DISPOSE OLD MODEL

    function clearModel() {
      if (model) {
        scene.remove(model);

        model.traverse(obj => {
          if (obj.geometry) obj.geometry.dispose();

          if (obj.material) {
            const materials = Array.isArray(obj.material)
              ? obj.material : [obj.material];

            materials.forEach(m => {
              if (m.map) m.map.dispose();
              m.dispose();
            });
          }
        });

        model = null;
      }

      wireGroup.clear();
      vertexGroup.clear();
    }

    // CREATE WIREFRAME

    function buildWireframe() {

      wireGroup.clear();
      vertexGroup.clear();

      if (!model) return;

      model.traverse(obj => {

        if (!obj.isMesh) return;

        const geometry = obj.geometry;

        const edges = new THREE.EdgesGeometry(
          geometry, 20
        );

        const line = new THREE.LineSegments(
          edges,
          new THREE.LineBasicMaterial({
            color: 0x9d8cff,
            transparent: true,
            opacity: Number(
              document.getElementById('wireOpacity').value
            )
          })
        );

        line.applyMatrix4(obj.matrixWorld);

        wireGroup.add(line);

        if (showVertices) {

          const positions = geometry.attributes.position;

          const points = [];

          for (let i = 0; i < positions.count; i++) {

            const p = new THREE.Vector3()
              .fromBufferAttribute(positions, i);

            p.applyMatrix4(obj.matrixWorld);

            points.push(p);
          }

          const vertexGeometry =
            new THREE.BufferGeometry()
              .setFromPoints(points);

          const pointsObject = new THREE.Points(
            vertexGeometry,
            new THREE.PointsMaterial({
              color: 0xffc857,
              size: Number(
                document.getElementById('vertexSize').value
              ),
              sizeAttenuation: true
            })
          );

          vertexGroup.add(pointsObject);
        }
      });
    }

    // DISPLAY MODES

    function setMode(mode) {

      currentMode = mode;

      if (!model) return;

      model.traverse(obj => {

        if (!obj.isMesh) return;

        const mats = Array.isArray(obj.material)
          ? obj.material : [obj.material];

        mats.forEach(mat => {

          mat.wireframe = false;
          mat.transparent = false;
          mat.opacity = 1;
          mat.depthWrite = true;

          if (mode === 'wireframe') {
            mat.wireframe = true;
          }

          if (mode === 'transparent') {
            mat.transparent = true;
            mat.opacity = 0.25;
            mat.depthWrite = false;
          }

        });
      });

      wireGroup.visible =
        mode === 'both';

      vertexGroup.visible =
        showVertices;

      buildWireframe();

      wireGroup.visible =
        mode === 'both';

      document.querySelectorAll('.mode')
        .forEach(btn => {
          btn.classList.toggle(
            'active',
            btn.dataset.mode === mode
          );
        });

      status.textContent = 'View: ' + mode;
    }

    // LOAD GLB / GLTF

    function loadModel(url) {

      const loader = new GLTFLoader();

      loader.load(url, gltf => {

        clearModel();

        model = gltf.scene;

        scene.add(model);

        model.updateMatrixWorld(true);

        fitCamera();

        setMode(currentMode);

        status.textContent =
          '3D Model Loaded Successfully';

      }, undefined, error => {

        console.error(error);

        status.textContent =
          'Could not load model. Check the file.';

      });
    }

    // CAMERA FIT

    function fitCamera() {

      if (!model) return;

      const box = new THREE.Box3().setFromObject(model);

      const center = box.getCenter(
        new THREE.Vector3()
      );

      const size = box.getSize(
        new THREE.Vector3()
      );

      const maxDim = Math.max(
        size.x, size.y, size.z
      );

      if (!maxDim) return;

      const distance =
        maxDim / (2 * Math.tan(
          THREE.MathUtils.degToRad(camera.fov / 2)
        ));

      camera.position.copy(center).add(
        new THREE.Vector3(
          distance * 1.4,
          distance * 0.9,
          distance * 1.4
        )
      );

      camera.near = maxDim / 1000;
      camera.far = maxDim * 100;
      camera.updateProjectionMatrix();

      controls.target.copy(center);
      controls.update();
    }

    // IMPORT 3D FILE

    document.getElementById('modelInput')
      .addEventListener('change', e => {

        const file = e.target.files[0];

        if (!file) return;

        const url = URL.createObjectURL(file);

        loadModel(url);

      });

    // IMAGE INPUT

    let uploadedImage = null;

    document.getElementById('imageInput')
      .addEventListener('change', e => {

        const file = e.target.files[0];

        if (!file) return;

        uploadedImage = file;

        status.textContent =
          'Image ready for AI reconstruction';

      });

    // AI GENERATION CONNECTION

    document.getElementById('generateBtn')
      .addEventListener('click', async () => {

        if (!uploadedImage) {
          alert('Please upload a 2D image first.');
          return;
        }

        status.textContent =
          'Sending image for 3D generation...';

        try {

          const form = new FormData();

          form.append('image', uploadedImage);

          // Your backend must connect to a real
          // image-to-3D AI generation service.

          const response = await fetch(
            '/api/generate-3d',
            {
              method: 'POST',
              body: form
            }
          );

          if (!response.ok) {
            throw new Error(
              'Generation API returned ' + response.status
            );
          }

          const blob = await response.blob();

          if (blob.size === 0) {
            throw new Error('Empty model received');
          }

          const url = URL.createObjectURL(blob);

          loadModel(url);

          status.textContent =
            'AI 3D model received!';

        } catch (error) {

          console.error(error);

          status.textContent =
            'AI API not connected or generation failed';

          alert(
            'Connect your backend to a real 3D AI service. ' +
            'The viewer itself is ready.'
          );

        }

      });

    // BUTTON EVENTS

    document.querySelectorAll('.mode')
      .forEach(btn => {

        btn.addEventListener('click', () => {
          setMode(btn.dataset.mode);
        });

      });

    document.getElementById('verticesBtn')
      .onclick = () => {

        showVertices = !showVertices;

        buildWireframe();

        vertexGroup.visible = showVertices;

        document.getElementById('verticesBtn')
          .textContent = showVertices
            ? 'Hide Vertices'
            : 'Show Vertices';

      };

    document.getElementById('wireOpacity')
      .oninput = buildWireframe;

    document.getElementById('vertexSize')
      .oninput = buildWireframe;

    document.getElementById('resetBtn')
      .onclick = () => {

        camera.position.set(4, 3, 6);

        controls.target.set(0, 0, 0);

        controls.update();

      };

    document.getElementById('fitBtn')
      .onclick = fitCamera;

    document.getElementById('rotateBtn')
      .onclick = e => {

        autoRotate = !autoRotate;

        e.target.textContent =
          'Auto Rotate: ' +
          (autoRotate ? 'ON' : 'OFF');

      };

    document.getElementById('frontBtn')
      .onclick = () => {
        camera.position.set(0, 0, 8);
        controls.target.set(0, 0, 0);
      };

    document.getElementById('sideBtn')
      .onclick = () => {
        camera.position.set(8, 0, 0);
        controls.target.set(0, 0, 0);
      };

    document.getElementById('topBtn')
      .onclick = () => {
        camera.position.set(0, 8, 0.01);
        controls.target.set(0, 0, 0);
      };

    // EXPORT GLB

    document.getElementById('exportBtn')
      .onclick = async () => {

        if (!model) {
          alert('Load or generate a 3D model first.');
          return;
        }

        try {

          const exporter = new GLTFExporter();

          const result = await exporter.parseAsync(
            model,
            { binary: true }
          );

          const blob = new Blob(
            [result],
            { type: 'model/gltf-binary' }
          );

          const url = URL.createObjectURL(blob);

          const link = document.createElement('a');

          link.href = url;
          link.download = '3d-model.glb';

          link.click();

          setTimeout(() => URL.revokeObjectURL(url), 1000);

          status.textContent = 'GLB exported!';

        } catch (error) {

          console.error(error);

          alert('Export failed.');

        }

      };

    // RESPONSIVE

    function resize() {

      const width = container.clientWidth;
      const height = container.clientHeight;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      renderer.setSize(width, height);

    }

    window.addEventListener('resize', resize);

    resize();

    // ANIMATION

    function animate() {

      requestAnimationFrame(animate);

      if (autoRotate && model) {
        model.rotation.y += 0.004;
      }

      controls.update();

      renderer.render(scene, camera);

    }

    animate();

  </script>
</body>

</html>
