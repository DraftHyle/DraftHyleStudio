<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D to 3D Studio</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10131e;
      color: white;
    }

    header {
      padding: 20px 30px;
      background: #191e2d;
      font-size: 22px;
      font-weight: bold;
    }

    main {
      display: grid;
      grid-template-columns: 300px 1fr;
      min-height: calc(100vh - 65px);
    }

    aside {
      padding: 25px;
      background: #191e2d;
    }

    button,
    input {
      width: 100%;
      margin: 12px 0;
    }

    button {
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #a78bfa;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    input[type="range"] {
      accent-color: #a78bfa;
    }

    #viewer {
      min-height: 550px;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
    }

    label {
      color: #c5c9d6;
    }

    @media(max-width:700px) {
      main {
        grid-template-columns: 1fr;
      }

      #viewer {
        min-height: 450px;
      }
    }
  </style>
</head>

<body>

  <header>✨ 2D → 3D Studio</header>

  <main>
    <aside>
      <h3>Create your 3D object</h3>

      <label>Upload your 2D image</label>
      <input type="file" id="upload" accept="image/*">

      <label>3D Depth</label>
      <input type="range" id="depth" min="0.05" max="2" step="0.05" value="0.3">

      <label>Rotation speed</label>
      <input type="range" id="speed" min="0" max="0.05" step="0.001" value="0.005">

      <button id="reset">Reset View</button>
      <button id="download">Download GLB</button>

      <p style="color:#aab0c0;font-size:12px">
        Upload an image to create a 3D floating object.
        Drag to rotate and scroll to zoom.
      </p>
    </aside>

    <div id="viewer"></div>
  </main>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    const viewer = document.getElementById('viewer');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#202638');

    const camera = new THREE.PerspectiveCamera(
      45, 1, 0.1, 100
    );
    camera.position.set(0, 0, 5);

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    viewer.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 2));

    const light = new THREE.DirectionalLight(0xffffff, 3);
    light.position.set(3, 4, 5);
    scene.add(light);

    let object = new THREE.Group();
    scene.add(object);

    let material;
    let currentDepth = 0.3;

    function resize() {
      const w = viewer.clientWidth;
      const h = viewer.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    new ResizeObserver(resize).observe(viewer);
    resize();

    function createObject(image) {
      object.clear();

      const texture = new THREE.Texture(image);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.needsUpdate = true;

      const aspect = image.width / image.height;
      const width = aspect >= 1 ? 3 : 3 * aspect;
      const height = aspect >= 1 ? 3 / aspect : 3;

      material = new THREE.MeshStandardMaterial({
        map: texture,
        roughness: 0.6,
        metalness: 0.05
      });

      const geometry = new THREE.BoxGeometry(
        width, height, currentDepth
      );

      const mesh = new THREE.Mesh(geometry, [
        new THREE.MeshStandardMaterial({ color: '#888' }),
        new THREE.MeshStandardMaterial({ color: '#888' }),
        new THREE.MeshStandardMaterial({ color: '#888' }),
        new THREE.MeshStandardMaterial({ color: '#888' }),
        material,
        new THREE.MeshStandardMaterial({ color: '#888' })
      ]);

      object.add(mesh);
    }

    document.getElementById('upload').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      const img = new Image();

      img.onload = () => {
        createObject(img);
        URL.revokeObjectURL(url);
      };

      img.src = url;
    });

    document.getElementById('depth').addEventListener('input', e => {
      currentDepth = Number(e.target.value);

      // Rebuild the uploaded object's geometry.
      if (object.children.length) {
        const mesh = object.children[0];
        const old = mesh.geometry;
        mesh.geometry = new THREE.BoxGeometry(
          old.parameters.width,
          old.parameters.height,
          currentDepth
        );
        old.dispose();
      }
    });

    document.getElementById('speed').addEventListener('input', e => {
      rotationSpeed = Number(e.target.value);
    });

    let rotationSpeed = 0.005;

    document.getElementById('reset').onclick = () => {
      camera.position.set(0, 0, 5);
      object.rotation.set(0, 0, 0);
      controls.reset();
    };

    document.getElementById('download').onclick = async () => {
      if (!object.children.length) {
        alert('Upload an image first!');
        return;
      }

      const exporter = new GLTFExporter();
      const result = await exporter.parseAsync(object, {
        binary: true
      });

      const blob = new Blob([result], {
        type: 'model/gltf-binary'
      });

      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'my-3d-object.glb';
      link.click();
      URL.revokeObjectURL(link.href);
    };

    function animate() {
      requestAnimationFrame(animate);
      object.rotation.y += rotationSpeed;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>

</html>
